[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = '\.venv'

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B008"]  # FastAPI Depends() in default args is idiomatic

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
