# =============================================================================
# Evaluation set for the NL -> semantic plan -> SQL pipeline.
#
# kind:
#   answer  - must be answered (status answered / answered_with_warning) and the
#             value(s) must match the reference SQL, computed independently on the
#             analytics tables (business rules written out by hand).
#   refuse  - must be refused ("I don't have sufficient data ...").
#   warn    - must carry a visible warning or be refused because data is missing
#             (accepted statuses listed in `statuses`); optional value check.
#   clarify - must ask for clarification (accepted statuses in `statuses`).
#
# compare (for answer / warn with reference_sql):
#   scalar  - first measure value vs. the single reference value
#   top_n   - first n labels in order + their values
#   rows    - same set of labels with the same values (order-insensitive)
#   series  - time series: same periods with the same values
#   top1    - label of the first row only
# tolerance: relative (default 0.005 = 0.5%)
# =============================================================================

questions:
  # --------------------------------------------------------------- totals
  - id: T01
    category: totals
    kind: answer
    question: What were total sales in 2017?
    compare: scalar
    reference_sql: >-
      SELECT SUM(order_revenue) FROM analytics.fact_orders
      WHERE order_status NOT IN ('canceled','unavailable') AND purchase_year = 2017

  - id: T02
    category: totals
    kind: answer
    question: How many orders were placed in 2018?
    compare: scalar
    reference_sql: SELECT COUNT(*) FROM analytics.fact_orders WHERE purchase_year = 2018

  - id: T03
    category: totals
    kind: answer
    question: How many customers do we have?
    compare: scalar
    reference_sql: SELECT COUNT(DISTINCT customer_unique_id) FROM analytics.fact_orders

  - id: T04
    category: totals
    kind: answer
    question: What is the average order value?
    compare: scalar
    reference_sql: >-
      SELECT SUM(order_revenue) / COUNT(*) FROM analytics.fact_orders
      WHERE order_status NOT IN ('canceled','unavailable')

  - id: T05
    category: totals
    kind: answer
    question: What is the average customer rating?
    compare: scalar
    reference_sql: SELECT AVG(review_score) FROM analytics.fact_orders

  - id: T06
    category: totals
    kind: answer
    question: How many items were sold in total?
    compare: scalar
    reference_sql: >-
      SELECT COUNT(*) FROM analytics.fact_order_items
      WHERE order_status NOT IN ('canceled','unavailable')

  - id: T07
    category: totals
    kind: answer
    question: What is the late delivery rate?
    compare: scalar
    reference_sql: >-
      SELECT 100.0 * COUNT(*) FILTER (WHERE is_late) / COUNT(*) FILTER (WHERE is_late IS NOT NULL)
      FROM analytics.fact_orders

  - id: T08
    category: totals
    kind: answer
    question: What percentage of orders were canceled?
    compare: scalar
    reference_sql: >-
      SELECT 100.0 * COUNT(*) FILTER (WHERE order_status = 'canceled') / COUNT(*)
      FROM analytics.fact_orders

  - id: T09
    category: totals
    kind: answer
    question: How long does delivery take on average?
    compare: scalar
    reference_sql: >-
      SELECT AVG(delivery_days) FROM analytics.fact_orders WHERE delivered_date IS NOT NULL

  - id: T10
    category: totals
    kind: answer
    question: How many sellers are there?
    compare: scalar
    reference_sql: SELECT COUNT(DISTINCT seller_id) FROM analytics.fact_order_items

  - id: T11
