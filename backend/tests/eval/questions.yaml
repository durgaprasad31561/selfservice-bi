  # ------------------------------------------------------------- rankings
  - id: R01
    category: rankings
    kind: answer
    question: Top 5 categories by revenue
    compare: top_n
    n: 5
    reference_sql: >-
      SELECT category_label, SUM(price) FROM analytics.fact_order_items
      WHERE order_status NOT IN ('canceled','unavailable')
      GROUP BY 1 ORDER BY 2 DESC LIMIT 5

  - id: R02
    category: rankings
    kind: answer
    question: Orders by payment type
    compare: rows
    tolerance: 0.02
    reference_sql: >-
      SELECT primary_payment_type_label, COUNT(*) FROM analytics.fact_orders
      WHERE primary_payment_type_label IS NOT NULL GROUP BY 1

  - id: R03
    category: rankings
    kind: answer
    question: Top 3 states by number of customers
    compare: top_n
    n: 3
    reference_sql: >-
      SELECT customer_state_name, COUNT(DISTINCT customer_unique_id) FROM analytics.fact_orders
      GROUP BY 1 ORDER BY 2 DESC LIMIT 3

  - id: R04
